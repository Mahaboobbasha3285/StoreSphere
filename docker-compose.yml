services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopsphere
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shopsecret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - shopsphere_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  shopsphere_data:
